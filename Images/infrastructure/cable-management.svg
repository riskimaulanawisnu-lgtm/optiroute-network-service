<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgC)"/>
  
  <!-- Cable tray horizontal main -->
  <rect x="40" y="60" width="520" height="30" rx="4" fill="#141414" stroke="#333" stroke-width="1.5"/>
  <!-- Cable tray dividers -->
  <line x1="140" y1="60" x2="140" y2="90" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="240" y1="60" x2="240" y2="90" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="340" y1="60" x2="340" y2="90" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="440" y1="60" x2="440" y2="90" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Cable bundles in tray -->
  <line x1="50" y1="68" x2="550" y2="68" stroke="#444" stroke-width="4" opacity="0.8"/>
  <line x1="50" y1="74" x2="550" y2="74" stroke="#555" stroke-width="3" opacity="0.6"/>
  <line x1="50" y1="79" x2="550" y2="79" stroke="#333" stroke-width="3" opacity="0.5"/>
  <line x1="50" y1="84" x2="550" y2="84" stroke="#444" stroke-width="2" opacity="0.4"/>
  
  <!-- Vertical cable drops -->
  <g>
    <!-- Drop 1 -->
    <path d="M 100 90 L 100 150 C 100 170, 90 180, 80 200" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M 108 90 L 108 155 C 108 175, 95 185, 85 205" stroke="#444" stroke-width="2.5" fill="none"/>
    <path d="M 116 90 L 116 160 C 116 182, 100 190, 90 210" stroke="#333" stroke-width="2" fill="none"/>
    
    <!-- Drop 2 -->
    <path d="M 200 90 L 200 140 C 200 165, 215 180, 230 200" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M 208 90 L 208 145 C 208 170, 225 185, 240 205" stroke="#444" stroke-width="2.5" fill="none"/>
    <path d="M 216 90 L 216 150 C 216 175, 235 190, 250 210" stroke="#333" stroke-width="2" fill="none"/>
    
    <!-- Drop 3 -->
    <path d="M 300 90 L 300 150 L 300 220" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M 308 90 L 308 155 L 308 225" stroke="#444" stroke-width="2.5" fill="none"/>
    <path d="M 316 90 L 316 160 L 316 230" stroke="#333" stroke-width="2" fill="none"/>
    
    <!-- Drop 4 -->
    <path d="M 400 90 L 400 140 C 400 165, 415 180, 430 200" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M 408 90 L 408 145 C 408 170, 425 185, 440 205" stroke="#444" stroke-width="2.5" fill="none"/>
    
    <!-- Drop 5 -->
    <path d="M 500 90 L 500 150 C 500 170, 510 180, 520 200" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M 508 90 L 508 155 C 508 175, 518 185, 525 205" stroke="#444" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Wall conduit runs -->
  <rect x="40" y="200" width="12" height="180" rx="3" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="285" y="200" width="12" height="180" rx="3" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="548" y="200" width="12" height="180" rx="3" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Floor outlets -->
  <rect x="60" y="345" width="40" height="30" rx="3" fill="#141414" stroke="#333" stroke-width="1.5"/>
  <rect x="65" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <rect x="80" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <text x="80" y="365" font-family="'JetBrains Mono', monospace" font-size="5" fill="#333" text-anchor="middle">DATA</text>
  
  <rect x="270" y="345" width="40" height="30" rx="3" fill="#141414" stroke="#333" stroke-width="1.5"/>
  <rect x="275" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <rect x="290" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <text x="290" y="365" font-family="'JetBrains Mono', monospace" font-size="5" fill="#333" text-anchor="middle">DATA</text>
  
  <rect x="490" y="345" width="40" height="30" rx="3" fill="#141414" stroke="#333" stroke-width="1.5"/>
  <rect x="495" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <rect x="510" y="350" width="12" height="10" rx="1" fill="#111" stroke="#2a2a2a" stroke-width="0.5"/>
  <text x="510" y="365" font-family="'JetBrains Mono', monospace" font-size="5" fill="#333" text-anchor="middle">DATA</text>
  
  <!-- Labels -->
  <text x="300" y="390" font-family="'JetBrains Mono', monospace" font-size="8" fill="#333" text-anchor="middle" letter-spacing="3">CABLE MANAGEMENT · STRUCTURED CABLING</text>
  
  <!-- Corner marks -->
  <rect x="10" y="10" width="25" height="2" fill="#222"/>
  <rect x="10" y="10" width="2" height="25" fill="#222"/>
  <rect x="565" y="10" width="25" height="2" fill="#222"/>
  <rect x="588" y="10" width="2" height="25" fill="#222"/>
  <rect x="10" y="388" width="25" height="2" fill="#222"/>
  <rect x="10" y="363" width="2" height="27" fill="#222"/>
  <rect x="565" y="388" width="25" height="2" fill="#222"/>
  <rect x="588" y="363" width="2" height="27" fill="#222"/>
</svg>
