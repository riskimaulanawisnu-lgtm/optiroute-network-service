<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="30%" stop-color="#101010"/>
      <stop offset="70%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#aaa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#aaa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="20%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#888" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bgBanner)"/>
  <rect width="1200" height="500" fill="url(#centerGlow)"/>
  <rect width="1200" height="500" fill="url(#leftGlow)"/>

  <!-- Abstract rack silhouettes (left) -->
  <g opacity="0.08">
    <!-- Rack outlines -->
    <rect x="40" y="60" width="100" height="400" rx="4" fill="none" stroke="#888" stroke-width="1.5"/>
    <rect x="155" y="80" width="100" height="380" rx="4" fill="none" stroke="#777" stroke-width="1.5"/>
    <rect x="270" y="40" width="100" height="420" rx="4" fill="none" stroke="#888" stroke-width="1.5"/>
    <!-- Unit lines -->
    <g stroke="#666" stroke-width="0.5">
      <line x1="50" y1="90" x2="130" y2="90"/>
      <line x1="50" y1="110" x2="130" y2="110"/>
      <line x1="50" y1="130" x2="130" y2="130"/>
      <line x1="50" y1="160" x2="130" y2="160"/>
      <line x1="50" y1="190" x2="130" y2="190"/>
      <line x1="50" y1="220" x2="130" y2="220"/>
      <line x1="50" y1="260" x2="130" y2="260"/>
      <line x1="50" y1="310" x2="130" y2="310"/>
      <line x1="50" y1="360" x2="130" y2="360"/>
      <line x1="165" y1="100" x2="245" y2="100"/>
      <line x1="165" y1="130" x2="245" y2="130"/>
      <line x1="165" y1="160" x2="245" y2="160"/>
      <line x1="165" y1="200" x2="245" y2="200"/>
      <line x1="165" y1="240" x2="245" y2="240"/>
      <line x1="280" y1="70" x2="360" y2="70"/>
      <line x1="280" y1="100" x2="360" y2="100"/>
      <line x1="280" y1="140" x2="360" y2="140"/>
    </g>
  </g>

  <!-- Abstract rack silhouettes (right) -->
  <g opacity="0.08">
    <rect x="830" y="40" width="100" height="420" rx="4" fill="none" stroke="#888" stroke-width="1.5"/>
    <rect x="945" y="60" width="100" height="400" rx="4" fill="none" stroke="#777" stroke-width="1.5"/>
    <rect x="1060" y="80" width="100" height="380" rx="4" fill="none" stroke="#888" stroke-width="1.5"/>
    <g stroke="#666" stroke-width="0.5">
      <line x1="840" y1="70" x2="920" y2="70"/>
      <line x1="840" y1="100" x2="920" y2="100"/>
      <line x1="840" y1="140" x2="920" y2="140"/>
      <line x1="840" y1="180" x2="920" y2="180"/>
      <line x1="840" y1="230" x2="920" y2="230"/>
      <line x1="840" y1="290" x2="920" y2="290"/>
      <line x1="955" y1="90" x2="1035" y2="90"/>
      <line x1="955" y1="120" x2="1035" y2="120"/>
      <line x1="955" y1="160" x2="1035" y2="160"/>
      <line x1="955" y1="200" x2="1035" y2="200"/>
      <line x1="1070" y1="110" x2="1150" y2="110"/>
      <line x1="1070" y1="150" x2="1150" y2="150"/>
      <line x1="1070" y1="200" x2="1150" y2="200"/>
    </g>
  </g>

  <!-- Horizontal divider lines -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Technical corner marks -->
  <rect x="20" y="20" width="50" height="2" fill="#2a2a2a"/>
  <rect x="20" y="20" width="2" height="50" fill="#2a2a2a"/>
  <rect x="1130" y="20" width="50" height="2" fill="#2a2a2a"/>
  <rect x="1178" y="20" width="2" height="50" fill="#2a2a2a"/>
  <rect x="20" y="478" width="50" height="2" fill="#2a2a2a"/>
  <rect x="20" y="430" width="2" height="50" fill="#2a2a2a"/>
  <rect x="1130" y="478" width="50" height="2" fill="#2a2a2a"/>
  <rect x="1178" y="430" width="2" height="50" fill="#2a2a2a"/>

  <!-- Fine horizontal scan lines for tech feel -->
  <g opacity="0.015">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="440" x2="1200" y2="440" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Center light sweep (subtle) -->
  <rect x="500" y="0" width="200" height="500" fill="url(#centerGlow)" opacity="2"/>

  <!-- Label strip top -->
  <text x="600" y="80" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2a2a2a" text-anchor="middle" letter-spacing="6">INFRASTRUKTUR ENTERPRISE · OPTIROUTE</text>

  <!-- Label strip bottom -->
  <text x="600" y="440" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2a2a2a" text-anchor="middle" letter-spacing="6">NETWORK INFRASTRUCTURE · PROFESSIONAL GRADE</text>
</svg>
