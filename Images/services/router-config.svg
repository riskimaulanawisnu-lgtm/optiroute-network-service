<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="bgR" cx="40%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="signalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aaa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aaa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bgR)"/>

  <!-- Signal arcs radiating from router -->
  <circle cx="400" cy="240" r="80" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="240" r="140" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="240" r="200" fill="none" stroke="#222" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="240" r="260" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>

  <!-- Router device (center) -->
  <g transform="translate(295, 190)">
    <!-- Main body -->
    <rect x="0" y="0" width="210" height="80" rx="10" fill="url(#deviceGrad)" stroke="#444" stroke-width="2"/>
    <!-- Top ridge -->
    <rect x="10" y="8" width="190" height="6" rx="3" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="0.5"/>
    <!-- Antennas -->
    <rect x="20" y="-50" width="4" height="52" rx="2" fill="#333" stroke="#444" stroke-width="1"/>
    <ellipse cx="22" cy="-52" rx="8" ry="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <rect x="186" y="-50" width="4" height="52" rx="2" fill="#333" stroke="#444" stroke-width="1"/>
    <ellipse cx="188" cy="-52" rx="8" ry="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <!-- Ports -->
    <rect x="12" y="30" width="14" height="10" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
    <rect x="30" y="30" width="14" height="10" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
    <rect x="48" y="30" width="14" height="10" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
    <rect x="66" y="30" width="14" height="10" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
    <rect x="84" y="30" width="14" height="10" rx="2" fill="#111" stroke="#444" stroke-width="1"/>
    <!-- Status LEDs -->
    <circle cx="140" cy="20" r="4" fill="#333"/>
    <circle cx="154" cy="20" r="4" fill="#444"/>
    <circle cx="168" cy="20" r="4" fill="#333"/>
    <circle cx="182" cy="20" r="4" fill="#444"/>
    <circle cx="196" cy="20" r="4" fill="#333"/>
    <!-- Label -->
    <text x="105" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#555" text-anchor="middle">WIRELESS ROUTER</text>
    <text x="105" y="73" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444" text-anchor="middle">MODEL: RT-AX88U PRO</text>
    <!-- USB/power ports -->
    <rect x="168" y="38" width="8" height="12" rx="1" fill="#111" stroke="#444" stroke-width="0.5"/>
    <rect x="180" y="38" width="8" height="12" rx="1" fill="#111" stroke="#444" stroke-width="0.5"/>
    <circle cx="197" cy="58" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  </g>

  <!-- Config interface overlay (right side) -->
  <g transform="translate(560, 100)" opacity="0.7">
    <rect x="0" y="0" width="200" height="280" rx="6" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="0" y="14" width="200" height="14" fill="#1a1a1a"/>
    <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888">ROUTER ADMIN PANEL</text>
    <!-- Menu items -->
    <text x="10" y="50" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">› Network Status</text>
    <text x="10" y="65" font-family="'JetBrains Mono', monospace" font-size="7" fill="#888">› Wireless Settings</text>
    <text x="10" y="80" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">› DHCP Configuration</text>
    <text x="10" y="95" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">› Firewall Rules</text>
    <text x="10" y="110" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">› Port Forwarding</text>
    <text x="10" y="125" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">› Bandwidth Monitor</text>
    <line x1="0" y1="135" x2="200" y2="135" stroke="#222" stroke-width="1"/>
    <!-- Stats -->
    <text x="10" y="152" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">WAN IP: 192.168.1.1</text>
    <text x="10" y="165" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">DNS: 8.8.8.8 / 8.8.4.4</text>
    <text x="10" y="178" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">DHCP: 192.168.0.100-200</text>
    <text x="10" y="191" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">Channel: Auto (6GHz)</text>
    <text x="10" y="204" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">Uptime: 14d 06h 42m</text>
    <!-- Bar chart -->
    <rect x="10" y="218" width="180" height="1" fill="#222"/>
    <rect x="10" y="224" width="120" height="8" rx="2" fill="#333"/>
    <rect x="10" y="224" width="80" height="8" rx="2" fill="#555"/>
    <text x="10" y="244" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">Bandwidth: 80% utilized</text>
    <rect x="10" y="252" width="120" height="8" rx="2" fill="#333"/>
    <rect x="10" y="252" width="40" height="8" rx="2" fill="#555"/>
    <text x="10" y="272" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">CPU Load: 32%</text>
  </g>

  <!-- Left info panel -->
  <g transform="translate(40, 100)" opacity="0.6">
    <rect x="0" y="0" width="180" height="160" rx="6" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>
    <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="7" fill="#666">CONNECTED DEVICES</text>
    <line x1="0" y1="28" x2="180" y2="28" stroke="#222" stroke-width="1"/>
    <text x="10" y="45" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">● DESKTOP-01    .101</text>
    <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">● LAPTOP-MKT    .102</text>
    <text x="10" y="75" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">○ PRINTER-HP    .103</text>
    <text x="10" y="90" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">● PHONE-CEO     .104</text>
    <text x="10" y="105" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">● CAMERA-01     .105</text>
    <text x="10" y="120" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">○ TABLET-01     .106</text>
    <text x="10" y="135" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">● NAS-SERVER    .110</text>
    <text x="10" y="150" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">12 devices total</text>
  </g>

  <text x="400" y="460" font-family="'JetBrains Mono', monospace" font-size="11" fill="#444" text-anchor="middle" letter-spacing="3">KONFIGURASI ROUTER · NETWORK MANAGEMENT</text>

  <!-- Corner marks -->
  <rect x="20" y="20" width="30" height="2" fill="#2a2a2a"/>
  <rect x="20" y="20" width="2" height="30" fill="#2a2a2a"/>
  <rect x="750" y="20" width="30" height="2" fill="#2a2a2a"/>
  <rect x="778" y="20" width="2" height="30" fill="#2a2a2a"/>
  <rect x="20" y="458" width="30" height="2" fill="#2a2a2a"/>
  <rect x="20" y="430" width="2" height="30" fill="#2a2a2a"/>
  <rect x="750" y="458" width="30" height="2" fill="#2a2a2a"/>
  <rect x="778" y="430" width="2" height="30" fill="#2a2a2a"/>
</svg>
