<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="patchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="480" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Network Switch (center) -->
  <g transform="translate(300, 180)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="url(#switchGrad)" stroke="#444" stroke-width="1.5"/>
    <!-- Port LEDs -->
    <g fill="#888">
      <rect x="12" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="26" y="22" width="10" height="6" rx="2" fill="#888"/>
      <rect x="40" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="54" y="22" width="10" height="6" rx="2" fill="#888"/>
      <rect x="68" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="82" y="22" width="10" height="6" rx="2" fill="#888"/>
      <rect x="96" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="110" y="22" width="10" height="6" rx="2" fill="#888"/>
      <rect x="124" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="138" y="22" width="10" height="6" rx="2" fill="#888"/>
      <rect x="152" y="22" width="10" height="6" rx="2" fill="#666"/>
      <rect x="166" y="22" width="10" height="6" rx="2" fill="#888"/>
    </g>
    <!-- Status LEDs -->
    <circle cx="12" cy="12" r="3" fill="#555"/>
    <circle cx="22" cy="12" r="3" fill="#777"/>
    <circle cx="32" cy="12" r="3" fill="#555"/>
    <!-- Ports bottom row -->
    <g>
      <rect x="12" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
      <rect x="26" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
      <rect x="40" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
      <rect x="54" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
      <rect x="68" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
      <rect x="82" y="34" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.5"/>
    </g>
    <text x="100" y="52" font-family="'JetBrains Mono', monospace" font-size="8" fill="#555" text-anchor="middle">NETWORK SWITCH 24-PORT</text>
  </g>

  <!-- Ethernet cables radiating from switch -->
  <!-- Cable top-left to workstation -->
  <path d="M 320 180 C 320 140, 160 160, 120 280" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 325 180 C 325 138, 162 158, 122 282" stroke="#555" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Cable top to router -->
  <path d="M 400 180 L 400 100" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Cable right to server -->
  <path d="M 500 200 C 560 200, 600 160, 640 160" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Cable bottom to workstations -->
  <path d="M 350 240 C 350 300, 160 320, 120 380" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 400 240 L 400 380" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 450 240 C 480 300, 580 320, 640 380" stroke="url(#cableGrad)" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Router (top) -->
  <g transform="translate(340, 50)">
    <rect x="0" y="0" width="120" height="45" rx="4" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
    <rect x="10" y="10" width="8" height="15" rx="2" fill="#444" stroke="#666" stroke-width="0.5"/>
    <rect x="22" y="10" width="8" height="15" rx="2" fill="#444" stroke="#666" stroke-width="0.5"/>
    <rect x="34" y="10" width="8" height="15" rx="2" fill="#444" stroke="#666" stroke-width="0.5"/>
    <circle cx="90" cy="22" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <circle cx="104" cy="22" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <text x="60" y="40" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555" text-anchor="middle">ROUTER</text>
  </g>

  <!-- Server rack (right) -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="80" height="180" rx="4" fill="#111" stroke="#444" stroke-width="1.5"/>
    <rect x="6" y="10" width="68" height="20" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="6" y="34" width="68" height="20" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="6" y="58" width="68" height="20" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="6" y="82" width="68" height="20" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="6" y="106" width="68" height="20" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Drive LEDs -->
    <circle cx="66" cy="20" r="3" fill="#444"/>
    <circle cx="66" cy="44" r="3" fill="#555"/>
    <circle cx="66" cy="68" r="3" fill="#444"/>
    <circle cx="66" cy="92" r="3" fill="#555"/>
    <circle cx="66" cy="116" r="3" fill="#444"/>
    <text x="40" y="165" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444" text-anchor="middle">SERVER</text>
  </g>

  <!-- Workstations (bottom) -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="80" height="55" rx="3" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="5" y="5" width="70" height="38" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="25" y="48" width="30" height="4" rx="1" fill="#222"/>
    <text x="40" y="72" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444" text-anchor="middle">PC-01</text>
  </g>

  <g transform="translate(360, 350)">
    <rect x="0" y="0" width="80" height="55" rx="3" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="5" y="5" width="70" height="38" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="25" y="48" width="30" height="4" rx="1" fill="#222"/>
    <text x="40" y="72" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444" text-anchor="middle">PC-02</text>
  </g>

  <g transform="translate(610, 350)">
    <rect x="0" y="0" width="80" height="55" rx="3" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="5" y="5" width="70" height="38" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="25" y="48" width="30" height="4" rx="1" fill="#222"/>
    <text x="40" y="72" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444" text-anchor="middle">PC-03</text>
  </g>

  <!-- Labels -->
  <text x="400" y="460" font-family="'JetBrains Mono', monospace" font-size="11" fill="#555" text-anchor="middle" letter-spacing="3">INSTALASI JARINGAN LAN · ENTERPRISE GRADE</text>

  <!-- Corner decorations -->
  <rect x="20" y="20" width="40" height="2" fill="#333"/>
  <rect x="20" y="20" width="2" height="40" fill="#333"/>
  <rect x="740" y="20" width="40" height="2" fill="#333"/>
  <rect x="778" y="20" width="2" height="40" fill="#333"/>
  <rect x="20" y="460" width="40" height="2" fill="#333"/>
  <rect x="20" y="438" width="2" height="40" fill="#333"/>
  <rect x="740" y="460" width="40" height="2" fill="#333"/>
  <rect x="778" y="438" width="2" height="40" fill="#333"/>
</svg>
