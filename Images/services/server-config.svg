      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
