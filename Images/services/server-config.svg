      <rect x="60" y="34" width="6" height="10" rx="1"/>
      <rect x="70" y="34" width="6" height="10" rx="1"/>
      <rect x="80" y="34" width="6" height="10" rx="1"/>
      <rect x="90" y="34" width="6" height="10" rx="1"/>
      <rect x="100" y="34" width="6" height="10" rx="1"/>
      <rect x="110" y="34" width="6" height="10" rx="1"/>
