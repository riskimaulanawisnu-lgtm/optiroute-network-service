<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <radialGradient id="signalRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg3)"/>

  <!-- Signal rings from ceiling AP -->
  <ellipse cx="400" cy="120" rx="60" ry="20" fill="none" stroke="#333" stroke-width="1" opacity="0.6"/>
  <ellipse cx="400" cy="120" rx="120" ry="40" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.5"/>
  <ellipse cx="400" cy="120" rx="200" ry="70" fill="none" stroke="#222" stroke-width="1" opacity="0.4"/>
  <ellipse cx="400" cy="120" rx="280" ry="100" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="120" rx="360" ry="130" fill="none" stroke="#161616" stroke-width="1" opacity="0.2"/>

  <!-- Coverage area fill -->
  <ellipse cx="400" cy="240" rx="320" ry="200" fill="#181818" opacity="0.3"/>

  <!-- Ceiling-mounted Access Point -->
  <g transform="translate(360, 60)">
    <!-- Ceiling mount plate -->
    <rect x="-10" y="-20" width="100" height="8" rx="3" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
    <!-- Mount post -->
    <rect x="35" y="-12" width="10" height="12" fill="#222" stroke="#3a3a3a" stroke-width="0.5"/>
    <!-- Main AP disc -->
    <ellipse cx="40" cy="12" rx="40" ry="10" fill="#1e1e1e" stroke="#555" stroke-width="1.5"/>
    <ellipse cx="40" cy="8" rx="38" ry="8" fill="#222" stroke="#444" stroke-width="1"/>
    <ellipse cx="40" cy="6" rx="20" ry="5" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5"/>
    <!-- LED ring -->
    <circle cx="40" cy="8" r="28" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Status LED -->
    <circle cx="40" cy="8" r="4" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#555" text-anchor="middle">ACCESS POINT</text>
  </g>

  <!-- Signal propagation lines -->
  <line x1="400" y1="120" x2="150" y2="300" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
  <line x1="400" y1="120" x2="650" y2="300" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
  <line x1="400" y1="120" x2="400" y2="380" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
  <line x1="400" y1="120" x2="200" y2="420" stroke="#222" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <line x1="400" y1="120" x2="600" y2="420" stroke="#222" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Connected devices with signal strength -->
  <!-- Laptop left -->
  <g transform="translate(80, 300)">
    <rect x="0" y="10" width="100" height="65" rx="4" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="5" y="15" width="90" height="48" rx="2" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
    <rect x="0" y="75" width="100" height="6" rx="2" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
    <rect x="30" y="77" width="40" height="4" rx="2" fill="#222"/>
    <!-- WiFi indicator -->
    <text x="50" y="8" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555" text-anchor="middle">▲ WiFi -65dBm</text>
    <text x="50" y="92" font-family="'JetBrains Mono', monospace" font-size="5" fill="#444" text-anchor="middle">LAPTOP-01</text>
  </g>

  <!-- Phone center -->
  <g transform="translate(360, 350)">
    <rect x="0" y="0" width="50" height="85" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="4" y="8" width="42" height="62" rx="2" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
    <circle cx="25" cy="78" r="4" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
    <text x="25" y="-6" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555" text-anchor="middle">▲ WiFi -58dBm</text>
  </g>

  <!-- PC right -->
  <g transform="translate(610, 290)">
    <rect x="0" y="0" width="80" height="55" rx="3" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="5" y="5" width="70" height="38" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="25" y="58" width="30" height="4" rx="1" fill="#222"/>
    <text x="40" y="-6" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555" text-anchor="middle">▲ WiFi -72dBm</text>
    <text x="40" y="72" font-family="'JetBrains Mono', monospace" font-size="5" fill="#444" text-anchor="middle">DESKTOP-01</text>
  </g>

  <!-- Coverage area label -->
  <text x="400" y="220" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">JANGKAUAN SINYAL: 2.4GHz / 5GHz / 6GHz</text>

  <!-- Signal strength legend -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="140" height="70" rx="4" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">SIGNAL STRENGTH</text>
    <rect x="10" y="22" width="80" height="4" rx="2" fill="#444"/>
    <rect x="10" y="22" width="70" height="4" rx="2" fill="#666"/>
    <text x="96" y="27" font-family="'JetBrains Mono', monospace" font-size="6" fill="#555">-55dBm</text>
    <rect x="10" y="34" width="80" height="4" rx="2" fill="#333"/>
    <rect x="10" y="34" width="45" height="4" rx="2" fill="#555"/>
    <text x="96" y="39" font-family="'JetBrains Mono', monospace" font-size="6" fill="#444">-68dBm</text>
    <rect x="10" y="46" width="80" height="4" rx="2" fill="#222"/>
    <rect x="10" y="46" width="20" height="4" rx="2" fill="#444"/>
    <text x="96" y="51" font-family="'JetBrains Mono', monospace" font-size="6" fill="#333">-78dBm</text>
    <text x="10" y="63" font-family="'JetBrains Mono', monospace" font-size="5" fill="#333">3 clients connected</text>
  </g>

  <text x="400" y="460" font-family="'JetBrains Mono', monospace" font-size="11" fill="#444" text-anchor="middle" letter-spacing="3">INSTALASI WIFI · WIRELESS COVERAGE</text>

  <rect x="20" y="20" width="30" height="2" fill="#2a2a2a"/>
  <rect x="20" y="20" width="2" height="30" fill="#2a2a2a"/>
  <rect x="750" y="20" width="30" height="2" fill="#2a2a2a"/>
  <rect x="778" y="20" width="2" height="30" fill="#2a2a2a"/>
  <rect x="20" y="458" width="30" height="2" fill="#2a2a2a"/>
  <rect x="20" y="430" width="2" height="30" fill="#2a2a2a"/>
  <rect x="750" y="458" width="30" height="2" fill="#2a2a2a"/>
  <rect x="778" y="430" width="2" height="30" fill="#2a2a2a"/>
</svg>
